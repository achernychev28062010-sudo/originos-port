name: originos-port

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: Official vivo full OTA zip
        default: https://sysupdxdl.vivo.com.cn/upgrade/oem/files/20260919214152e4ba49adf9db36886a6d44311a581940.zip
      redroid_tags:
        description: Redroid base images to try, first that pulls wins
        default: 15.0.0-latest
      gpu_mode:
        default: guest
      boot_minutes:
        description: How long to wait for sys.boot_completed
        default: "15"
      baseline:
        description: Also test stock Redroid versions
        type: boolean
        default: false

jobs:
  # Which stock Redroid actually reaches the home screen on this runner (no GPU)?
  # Run 2 answer: 14 and 15 boot, 16 crashes in surfaceflinger RenderEngine.
  baseline:
    if: inputs.baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: 16.0.0-latest, gpu: guest }
          - { tag: 16.0.0-latest, gpu: auto }
          - { tag: 15.0.0-latest, gpu: guest }
          - { tag: 14.0.0-latest, gpu: guest }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/host_prep.sh
      - run: docker pull redroid/redroid:${{ matrix.tag }}
      - run: bash scripts/boot_test.sh redroid/redroid:${{ matrix.tag }} stock 8 ${{ matrix.gpu }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ matrix.tag }}-${{ matrix.gpu }}
          path: /work/out

  port:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host prep (disk, binder, tools)
        run: bash scripts/host_prep.sh

      - name: Pull Redroid base
        run: |
          for t in ${{ inputs.redroid_tags }}; do
            if docker pull redroid/redroid:$t; then echo "BASE=redroid/redroid:$t" >> $GITHUB_ENV; break; fi
          done
          grep -q '^BASE=' $GITHUB_ENV

      - name: Fetch and unpack OriginOS partitions
        run: bash scripts/fetch_ota.sh "${{ inputs.ota_url }}" /work/ota

      - name: Build hybrid image
        run: bash scripts/build_hybrid.sh "$BASE" /work/ota originos:port

      - name: Boot OriginOS
        run: bash scripts/boot_test.sh originos:port originos ${{ inputs.boot_minutes }} ${{ inputs.gpu_mode }} || true

      - name: Make results readable
        if: always()
        run: sudo chown -R "$USER" /work/out && chmod -R a+rX /work/out && ls -laR /work/out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port
          path: /work/out
